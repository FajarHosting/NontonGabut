name: Poll Telegram Bot

concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Vercel polling endpoint
        env:
          VERCEL_POLL_URL: ${{ secrets.VERCEL_POLL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$VERCEL_POLL_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_POLL_URL"
